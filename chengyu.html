<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3b7c6">
  <meta name="description" content="成语填字。点空格，再点字。可以离线玩。">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="小游戏">
  <title>成语 · 妈妈的小游戏</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
  <script src="./js/boot.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到内容</a>
  <main id="main" class="app cy-app" tabindex="-1">
    <p id="old-browser" hidden>这个浏览器太旧了，请用 Chrome 打开。</p>
    <header class="topbar">
      <a class="back" href="./index.html">返回</a>
      <h1>成语</h1>
      <button id="contrast" type="button" aria-pressed="false">对比</button>
    </header>

    <div id="path-view">
      <div class="segment" role="radiogroup" aria-label="难度">
        <button type="button" id="diff-easy" role="radio" aria-checked="true">简单</button>
        <button type="button" id="diff-medium" role="radio" aria-checked="false">中等</button>
        <button type="button" id="diff-hard" role="radio" aria-checked="false">困难</button>
      </div>
      <p class="help">点空格，再点下面的字。点错了，再点一下就能拿回来。<span lang="en">Tap a square, then a character. Tap again to undo.</span></p>
      <div id="level-list"></div>
      <p id="load-error" class="status" hidden>暂时读不到题目。请再打开一次。</p>
    </div>

    <div id="play-view" hidden>
      <p id="play-kicker" class="unit-kicker"></p>
      <p id="play-count" class="filled"></p>
      <div id="cy-board" class="cy-board" role="group" aria-label="成语填字"></div>
      <div id="cy-meaning" class="cy-meaning" hidden></div>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="cy-tray" class="cy-tray" role="group" aria-label="候选字"></div>
      <div class="tools block-tools cy-tools">
        <button type="button" id="hint">提示<span class="btn-en" lang="en">Hint</span></button>
        <button type="button" id="to-levels">关卡<span class="btn-en" lang="en">Levels</span></button>
      </div>
    </div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <p id="modal-en" class="lede" lang="en"></p>
      <div class="modal-actions" id="modal-actions">
        <button type="button" id="modal-cancel"></button>
        <button type="button" id="modal-ok"></button>
      </div>
    </div>
  </div>
  <script type="module" src="./js/chengyu.js"></script>
</body>
</html>
